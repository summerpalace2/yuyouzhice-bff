<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-cq-changjiang-cable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d0e0e" />
      <stop offset="100%" stop-color="#1a0606" />
    </linearGradient>
    <radialGradient id="glow-cq-changjiang-cable" cx="75%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#grad-cq-changjiang-cable)" />
  <rect width="600" height="360" rx="16" fill="url(#glow-cq-changjiang-cable)" />

  <!-- Background Decorative Grid & Wave Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="600" y2="90" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="270" x2="600" y2="270" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
  </g>

  <!-- Big Decorative Icon Watermark -->
  <text x="470" y="240" font-size="140" fill="#ef4444" opacity="0.16" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="900" text-anchor="middle">索</text>

  <!-- District Badge -->
  <g transform="translate(40, 40)">
    <rect width="70" height="24" rx="6" fill="#ef4444" />
    <text x="35" y="16" fill="#18181b" font-size="12" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">渝中区</text>
  </g>

  <!-- Attraction Title -->
  <text x="40" y="115" fill="#ffffff" font-size="32" font-weight="800" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" filter="url(#shadow)">长江索道</text>

  <!-- Summary / Subtitle -->
  <text x="40" y="155" fill="#fee2e2" font-size="15" font-weight="400" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" opacity="0.9">
    <tspan x="40" dy="0">横跨长江的“空中公交”，在车厢中近距离感受江水与</tspan>
    <tspan x="40" dy="24">楼宇穿行。</tspan>
  </text>

  <!-- Key Attributes Line -->
  <g transform="translate(40, 225)" font-size="13" font-family="system-ui, sans-serif">
    <text fill="#94a3b8">⏱️ 游玩时长：<tspan fill="#e2e8f0" font-weight="600">约 60 分钟 (含排队)</tspan></text>
    <text x="180" fill="#94a3b8">🎫 门票：<tspan fill="#e2e8f0" font-weight="600">需购票 </tspan></text>
    <text x="330" fill="#94a3b8">🚶 强度：<tspan fill="#34d399" font-weight="600">轻松少走</tspan></text>
  </g>

  <!-- Tags -->
  
    <g transform="translate(40, 270)">
      <rect width="85" height="26" rx="13" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="1" />
      <text x="42.5" y="17" fill="#ef4444" font-size="12" font-weight="600" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">空中巴士</text>
    </g>
  
    <g transform="translate(135, 270)">
      <rect width="85" height="26" rx="13" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="1" />
      <text x="42.5" y="17" fill="#ef4444" font-size="12" font-weight="600" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">飞渡长江</text>
    </g>
  
    <g transform="translate(230, 270)">
      <rect width="85" height="26" rx="13" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="1" />
      <text x="42.5" y="17" fill="#ef4444" font-size="12" font-weight="600" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">地标</text>
    </g>
  
</svg>